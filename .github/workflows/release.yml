name: Release

on:
  push:
    tags: ["v*"]
  # Dry run: build, sign, notarize and check the DMG with Gatekeeper, but publish nothing.
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp into the dry-run build (like 1.2.3 or 1.2.3-beta.1)
        default: "0.0.0"

# Read-only by default. Only the publish job, which never sees the signing certificate, can write.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    # Apple's notary service sometimes takes most of an hour per submission.
    timeout-minutes: 150
    outputs:
      version: ${{ steps.v.outputs.version }}
      dmg_sha: ${{ steps.sums.outputs.dmg_sha }}
      signed: ${{ steps.sums.outputs.signed }}
    env:
      APP_NAME: Tracker for GitHub
      # Signing and notarizing turn on automatically when these repository secrets exist.
      # Without them the release is ad-hoc signed (first launch needs "Open Anyway").
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.APPLE_TEAM_ID != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' && secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # The version can come from the manual-run box, so it is checked before anything uses it,
      # and later steps only ever read it as "$VERSION", never pasted into a script.
      - name: Version from tag
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then V="$INPUT_VERSION"; else V="${GITHUB_REF_NAME#v}"; fi
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$V' isn't a version like 1.2.3 or 1.2.3-beta.1."
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # Everything that installs or runs third-party tooling happens before the certificate is imported.
      - name: Unit tests
        run: swift test --package-path Packages/TrackerKit --skip Screenshot --skip GraphLayoutTests/livePopover

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application" \
            || { echo "The certificate in MACOS_CERTIFICATE_P12 is not a Developer ID Application certificate."; exit 1; }
          [[ "$TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "APPLE_TEAM_ID doesn't look like a team ID."; exit 1; }
          # Same settings as a local Config/Signing.xcconfig, with the team from the secret.
          sed "s/YOURTEAMID/$TEAM_ID/" Config/Signing.xcconfig.example > Config/Signing.xcconfig

      - name: Build (Release)
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          xcodebuild -project TrackerForGitHub.xcodeproj -scheme TrackerForGitHub \
            -configuration Release -destination "generic/platform=macOS" \
            -derivedDataPath build.nosync/dd MARKETING_VERSION="$VERSION" build
          mkdir -p dist
          ditto "build.nosync/dd/Build/Products/Release/$APP_NAME.app" "dist/$APP_NAME.app"
          codesign --verify --deep --strict --verbose=2 "dist/$APP_NAME.app"
          codesign -dv "dist/$APP_NAME.app" 2>&1 | grep -E "Authority|TeamIdentifier|Runtime" || true
          echo "Entitlements of the app and widget:"
          codesign -d --entitlements - "dist/$APP_NAME.app" 2>/dev/null || true
          codesign -d --entitlements - "dist/$APP_NAME.app/Contents/PlugIns/TrackerWidgets.appex" 2>/dev/null || true

      - name: Write App Store Connect API key
        if: env.HAS_NOTARY == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Notarize and staple the app
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent "dist/$APP_NAME.app" "$RUNNER_TEMP/notarize-app.zip"
          scripts/notarize.sh "$RUNNER_TEMP/notarize-app.zip" "dist/$APP_NAME.app"
          spctl --assess --type execute --verbose=2 "dist/$APP_NAME.app"

      - name: Package DMG and zip
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p dmgroot
          ditto "dist/$APP_NAME.app" "dmgroot/$APP_NAME.app"
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "$APP_NAME $VERSION" -srcfolder dmgroot -ov -format UDZO "dist/Tracker-for-GitHub-$VERSION.dmg"
          if [ "$HAS_SIGNING" = "true" ]; then
            codesign --sign "Developer ID Application" --timestamp "dist/Tracker-for-GitHub-$VERSION.dmg"
          fi
          (cd dist && ditto -c -k --keepParent "$APP_NAME.app" "Tracker-for-GitHub-$VERSION.zip")

      - name: Notarize and staple the DMG
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          DMG="dist/Tracker-for-GitHub-$VERSION.dmg"
          scripts/notarize.sh "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"

      - name: Checksums
        id: sums
        run: |
          (cd dist && shasum -a 256 *.dmg *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "dmg_sha=$(shasum -a 256 dist/*.dmg | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          if [ "$HAS_SIGNING" = "true" ] && [ "$HAS_NOTARY" = "true" ]; then echo "signed=true"; else echo "signed=false"; fi >> "$GITHUB_OUTPUT"

      - name: Release notes
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[?"v"\\]?" {f=1; next} /^## / && f {exit} f' CHANGELOG.md | { grep -v '^\[' || true; } > dist/notes.md
          if [ "$HAS_SIGNING" = "true" ] && [ "$HAS_NOTARY" = "true" ]; then
            cat >> dist/notes.md <<'NOTES'

          ### Install
          Download the `.dmg`, open it and drag **Tracker for GitHub** into Applications. It's signed and notarized by Apple, so it opens normally.
          Or with Homebrew: `brew install --cask garoknows/tap/tracker-for-github`
          NOTES
          else
            cat >> dist/notes.md <<'NOTES'

          ### Install
          Download the `.dmg`, open it and drag **Tracker for GitHub** into Applications.
          The first time, macOS asks you to approve it: **System Settings → Privacy & Security → Open Anyway**.
          Step-by-step guide with pictures: [docs/INSTALL.md](https://github.com/garoknows/github-tracker/blob/main/docs/INSTALL.md).
          NOTES
          fi
          cat dist/notes.md

      - name: Keep the release files for the publish job
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/notes.md
          retention-days: 3
          if-no-files-found: error

      - name: Remove the signing keychain and key files
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/notarize-app.zip" Config/Signing.xcconfig

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      SHA: ${{ needs.build.outputs.dmg_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.zip dist/SHA256SUMS.txt \
            --title "Tracker for GitHub $VERSION" --notes-file dist/notes.md

      # The token is handed to git through gh's credential helper, so it is never written into a
      # clone URL or a .git/config file. update-cask.sh changes only the version and sha256 lines.
      - name: Update the Homebrew cask (skipped without HOMEBREW_TAP_TOKEN)
        if: needs.build.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "No HOMEBREW_TAP_TOKEN secret; update the tap with scripts/update-cask.sh."; exit 0; fi
          gh auth setup-git
          gh repo clone garoknows/homebrew-tap tap
          scripts/update-cask.sh tap/Casks/tracker-for-github.rb "$VERSION" "$SHA"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "tracker-for-github $VERSION"
          git push
          ! grep -rq "x-access-token" .git/config
