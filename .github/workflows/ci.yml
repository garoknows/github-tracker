name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so the secret scan can read every commit in a pull request.
          fetch-depth: 0
          persist-credentials: false

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Unit tests (TrackerKit, no network)
        run: swift test --package-path Packages/TrackerKit

      - name: Check the Xcode project matches project.yml
        run: |
          brew install xcodegen
          xcodegen generate
          if ! git diff --exit-code TrackerForGitHub.xcodeproj; then
            echo "::error::TrackerForGitHub.xcodeproj is out of date. Run 'xcodegen generate' and commit the result."
            exit 1
          fi

      - name: Cask updates only touch version and sha256
        run: scripts/test-update-cask.sh

      - name: Build app and widgets (Release, ad-hoc signed)
        run: |
          xcodebuild -project TrackerForGitHub.xcodeproj -scheme TrackerForGitHub \
            -configuration Release -destination "generic/platform=macOS" \
            -derivedDataPath build.nosync/dd build

      - name: Render the printable install guide from docs/INSTALL.md
        run: swift run --package-path tools/docgen docgen .

      - name: Keep the rendered guide (to compare with the committed PDF)
        uses: actions/upload-artifact@v4
        with:
          name: install-guide-pdf
          path: |
            docs/Tracker-for-GitHub-Install-Guide.pdf
            site/Tracker-for-GitHub-Install-Guide.pdf
          retention-days: 7

      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
